<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Productivity Tracker</title>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      width: 300px;
      margin: 0;
      padding: 16px;
      background-color: #1a1a2e;
      color: #e2e8f0;
    }
    h2 {
      font-size: 18px;
      margin-top: 0;
      margin-bottom: 12px;
      color: #fff;
    }
    .stats-container {
      background-color: #16213e;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 16px;
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 14px;
    }
    .stat-value {
      font-weight: bold;
    }
    .text-green { color: #4ade80; }
    .text-red { color: #f87171; }
    .btn {
      display: block;
      width: 100%;
      padding: 10px;
      background-color: #2563eb;
      color: white;
      text-align: center;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
      border: none;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .btn:hover {
      background-color: #1d4ed8;
    }
    .toggle-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 14px;
    }
    /* Simple switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 40px;
      height: 20px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #ccc;
      transition: .4s;
      border-radius: 34px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 2px;
      bottom: 2px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }
    input:checked + .slider { background-color: #2563eb; }
    input:checked + .slider:before { transform: translateX(20px); }
  </style>
</head>
<body>
  <h2>Productivity Tracker</h2>
  
  <div class="toggle-container">
    <span>Tracking Active</span>
    <label class="switch">
      <input type="checkbox" id="tracking-toggle" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="stats-container">
    <div class="stat-row">
      <span>Today's Time:</span>
      <span class="stat-value" id="total-time">Loading...</span>
    </div>
    <div class="stat-row">
      <span>Productive:</span>
      <span class="stat-value text-green" id="productive-time">--</span>
    </div>
    <div class="stat-row">
      <span>Unproductive:</span>
      <span class="stat-value text-red" id="unproductive-time">--</span>
    </div>
    <div class="stat-row">
      <span>Neutral:</span>
      <span class="stat-value" id="neutral-time">--</span>
    </div>
  </div>

  <button class="btn" id="open-dashboard">Open Dashboard</button>

  <script src="popup.js"></script>
</body>
</html>
